# Minimal, cross-platform environment for the notebooks and python/ modules.
# Create with:  conda env create -f environment.yml && conda activate nescatt_2025
# Bounds are deliberately loose; the original analysis ran on Python 3.9, numpy 1.23,
# scipy 1.8, matplotlib 3.5-3.8 and pandas 2.2. Tighten to exact pins once CI is green.
name: nescatt_2025
channels:
  - conda-forge
dependencies:
  - python=3.10
  - numpy>=1.23,<2
  - scipy>=1.8,<1.14
  - pandas>=1.5,<2.3
  - matplotlib-base>=3.5,<3.9
  - sympy
  - h5py
  - ipykernel
  - ipython
  - jupyterlab
  - nbformat
  - colored<3
  - fortranformat
  - pip
  - pip:
      - pyteomics==4.7.5
      - periodictable==2.0.1
