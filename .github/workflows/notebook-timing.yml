name: Notebook timing (manual)

# Runs every maintained notebook once and reports how long each takes and whether it passes.
# Use the result to decide which notebooks belong in ci/fast-notebooks.txt.
on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash -el {0}

jobs:
  timing:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: nescatt_2025
          environment-file: environment.yml
          auto-activate-base: false
      - run: pip install nbmake pytest
      - run: python -m ipykernel install --user --name nescatt_2025
      - name: Run all maintained notebooks
        continue-on-error: true
        run: |
          pytest --nbmake --nbmake-kernel=nescatt_2025 --nbmake-timeout=3000 --durations=0 -rA \
            1-Physical-Processes/*.ipynb 2-Flux/[A-E]-*.ipynb 3-Final-Spectra/A-*.ipynb \
            Comparisons/*.ipynb
